<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__ · 路线预览</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#203029;background:#fff}
    main{max-width:1000px;margin:auto;padding:20px}h1{font-size:22px;margin:0 0 8px}
    p{line-height:1.6}.map{height:560px;background:#f3f6f4}.status{color:#5b4531}
    .legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.legend span{display:flex;align-items:center;gap:6px}
    .swatch{display:inline-block;width:22px;height:4px;background:#168066}.other{background:#b66b16}
    select{font:inherit;max-width:100%;padding:8px}code{overflow-wrap:anywhere}li{margin:6px 0}
    svg{width:100%;height:100%}[hidden]{display:none!important}
    @media(max-width:480px){main{padding:12px}.map{height:460px}h1{font-size:19px}}
  </style>
</head>
<body><main>
  <h1>__TITLE__</h1>
  <p>__PROVIDER__自行车规划 · __DISTANCE__ 公里 · 待用户确认</p>
  <p id="map-status" class="status" role="status">底图未加载；下方先展示真实轨迹示意，不包含周边道路。</p>
  <div id="fallback" class="map"><svg role="img" aria-label="真实轨迹示意，底图未加载"></svg></div>
  <div id="map" class="map" aria-label="路线地图" hidden></div>
  <div class="legend"><span><i class="swatch"></i>名称含“绿道”的路段</span><span><i class="swatch other"></i>其他道路（不代表无自行车道）</span></div>
  <label>查看道路 <select id="road"><option value="all">完整路线</option></select></label>
  <p id="detail" aria-live="polite"></p>
  <ul>__WARNINGS__</ul>
  <p>确认路线后，由 Agent 按同一份预览数据制作 GPX；此页面不会自行导出。</p>
  <details><summary>路线核对信息</summary><p>预览标识：<code>__SHA256__</code></p><p>轨迹由 GCJ-02 近似转换为 WGS84；地图使用 OpenStreetMap，在线底图需要网络。此文件不含地图 Key 或 AK。</p></details>
  <script type="application/json" id="route-data">__DATA__</script>
  <script>
  (()=>{
    const data=JSON.parse(document.getElementById('route-data').textContent);
    const fallback=document.getElementById('fallback'),svg=fallback.querySelector('svg'),choice=document.getElementById('road'),detail=document.getElementById('detail');
    const color=s=>s.name.includes('绿道')?'#168066':'#b66b16';
    let map=null,layers=[];
    data.steps.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name} · ${s.distance_m} 米`;choice.append(o)});
    function drawFallback(){
      const w=fallback.clientWidth||700,h=fallback.clientHeight||560,ns='http://www.w3.org/2000/svg';
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();
      const pts=data.segments.flat(),xs=pts.map(p=>p[0]),ys=pts.map(p=>Math.log(Math.tan(Math.PI/4+p[1]*Math.PI/360)));
      const minX=Math.min(...xs)*Math.PI/180,maxX=Math.max(...xs)*Math.PI/180,minY=Math.min(...ys),maxY=Math.max(...ys);
      const scale=Math.min((w-70)/Math.max(maxX-minX,1e-9),(h-80)/Math.max(maxY-minY,1e-9));
      const project=p=>[(w-(maxX-minX)*scale)/2+(p[0]*Math.PI/180-minX)*scale,(h-(maxY-minY)*scale)/2+(maxY-Math.log(Math.tan(Math.PI/4+p[1]*Math.PI/360)))*scale];
      const element=(tag,attrs,text)=>{const el=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(text)el.textContent=text;svg.append(el);return el};
      data.segments.forEach(seg=>element('polyline',{points:seg.map(project).map(p=>p.join(',')).join(' '),fill:'none',stroke:'#b66b16','stroke-width':3}));
      data.steps.forEach((s,i)=>element('polyline',{points:s.points.map(project).map(p=>p.join(',')).join(' '),fill:'none',stroke:color(s),'stroke-width':choice.value===String(i)?6:3,opacity:choice.value==='all'||choice.value===String(i)?1:.2}));
      data.markers.forEach((m,i)=>{const [x,y]=project(m.point);element('circle',{cx:x,cy:y,r:5,fill:'#fff',stroke:'#203029','stroke-width':2});if(i===0||i===data.markers.length-1)element('text',{x:Math.max(30,Math.min(w-30,x)),y:y+(i===0?23:-15),'text-anchor':'middle',fill:'#203029','font-size':14},i===0?'起点':'终点')});
    }
    function update(){
      const all=choice.value==='all',i=Number(choice.value);
      detail.textContent=all?data.markers.map(m=>m.name).join(' → '):`${data.steps[i].name}，${data.steps[i].distance_m} 米`;
      if(map){layers.forEach((l,j)=>l.setStyle({opacity:all||i===j?1:.2,weight:i===j&&!all?7:4}));if(all)map.fitBounds(data.segments.flat().map(p=>[p[1],p[0]]),{padding:[30,30]});else map.fitBounds(layers[i].getBounds(),{padding:[30,30],maxZoom:17})}
      drawFallback();
    }
    choice.addEventListener('change',update);window.addEventListener('resize',drawFallback);update();
    const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
    script.onload=()=>{
      document.getElementById('map').hidden=false;fallback.hidden=true;
      map=L.map('map');
      const status=document.getElementById('map-status');
      let errors=0;
      const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
      tiles.on('tileerror',()=>{errors++;status.textContent='部分底图未能加载；轨迹仍为真实规划结果，请勿将空白区域理解为没有道路。'});
      tiles.on('load',()=>{if(!errors)status.textContent='路线已加载；请选择路段查看详情。'});tiles.addTo(map);
      const textNode=t=>{const n=document.createElement('span');n.textContent=t;return n};
      data.segments.forEach(seg=>L.polyline(seg.map(p=>[p[1],p[0]]),{color:'#b66b16',weight:3}).addTo(map));
      layers=data.steps.map(s=>L.polyline(s.points.map(p=>[p[1],p[0]]),{color:color(s),weight:4}).bindPopup(textNode(`${s.name} · ${s.distance_m} 米`)).addTo(map));
      data.markers.forEach((m,i)=>L.circleMarker([m.point[1],m.point[0]],{radius:6,color:'#203029',fillColor:'#fff',fillOpacity:1}).bindTooltip(textNode(`${i===0?'起点':i===data.markers.length-1?'终点':'途经点'}：${m.name}`)).addTo(map));
      update();
    };
    script.onerror=()=>{document.getElementById('map-status').textContent='地图组件无法加载；当前仅为真实轨迹示意，请让 Agent 提供可查看的地图。'};
    document.head.append(script);
  })();
  </script>
</main></body></html>
